<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Duy Đinh</title>
  <link rel="icon" href="./Picture/favicon.png" sizes="168x168">
  <link rel="apple-touch-icon" href="./Picture/favicon.png">
  <meta name="theme-color" content="#0073e6" />

  <link rel="stylesheet" href="Profile.css"/>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <!-- Nút bắt đầu -->
<div id="startOverlay" >
  <button  id="startBtn" >Bắt đầu trải nghiệm 🎧</button>
</div>
<div class="page-center">
  <div class="profile-wrapper center-layout">
    <h1 class="rainbow-text">Xin chào! Mình là Duy Đinh</h1>
    <img src="Picture/z6695507495676_0bd96a52f683ad5553ac64e081d24c97.jpg" alt="Ảnh đại diện" class="avatar" />

    <div class="social-icons">
      <a href="https://www.facebook.com/duy.inh.656618?locale=vi_VN" target="_blank"><i class="ri-facebook-circle-fill"></i></a>
      <a href="https://www.tiktok.com/@dyu_04s" target="_blank"><i class="ri-tiktok-fill"></i></a>
      <a href="legit.html" target="_blank"><i class="ri-message-3-fill"></i></a>
    </div>

    <div class="music-player">
      <div class="disc" id="disc"></div>  
      <audio id="audio" preload="metadata"></audio>
      <div id="trackTitle" class="track-title">Đang tải danh sách nhạc...</div>
      <div class="progress-row">
        <span id="currentTime">0:00</span>
        <input id="progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Tiến trình bài hát">
        <span id="duration">0:00</span>
      </div>
      <div class="buttons">
        <button id="shuffleBtn" title="Bật phát ngẫu nhiên" aria-label="Phát ngẫu nhiên" aria-pressed="false"><i class="ri-shuffle-line"></i></button>
        <button id="prevBtn" aria-label="Bài trước"><i class="ri-skip-left-fill"></i></button>
        <button id="playPauseBtn" aria-label="Phát nhạc"><i class="ri-play-line"></i></button>
        <button id="nextBtn" aria-label="Bài tiếp theo"><i class="ri-skip-right-fill"></i></button>
      </div>
      <details class="playlist-panel">
        <summary>Danh sách phát</summary>
        <div id="playlist" class="playlist"></div>
      </details>
      <a class="admin-link" href="/admin" target="_blank" rel="noopener">Quản lý nhạc</a>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/gh/loktar00/JQuery-Snowfall/jquery.snowfall.min.js"></script>
<script src="Profile.js"></script>

</body>
</html>
